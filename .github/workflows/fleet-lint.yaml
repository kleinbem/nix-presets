name: fleet-lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  fleet-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans every commit of the PR
          persist-credentials: false
      - uses: kleinbem/actions/nix-setup@b3ffb6b2eeb888969e5f16640c84a55956581542 # v1.9.0
      - uses: kleinbem/actions/lint@b3ffb6b2eeb888969e5f16640c84a55956581542 # v1.9.0
