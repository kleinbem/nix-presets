name: Dispatch nix-config lock bump

# A merge here reaches no host until nix-config's flake.lock moves, which the
# nightly Maintain Flake run would do at 03:00 UTC. So once main is green, ask
# nix-config to bump just this input in its lock PR. The App token is scoped
# to nix-config and needs only the contents permission.
on:
  # no-link: zizmor flags every workflow_run; this one only reacts to a
  # successful main run and checks nothing out.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Check Flake"]
    branches: [main]
    types: [completed]

permissions: {}

jobs:
  dispatch:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token for nix-config
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: nix-config
          permission-contents: write

      - name: Ask Maintain Flake to bump this input
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          INPUT: ${{ github.event.repository.name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$OWNER/nix-config/dispatches" \
            -f event_type=lock-bump \
            -f "client_payload[inputs]=$INPUT" \
            -f "client_payload[sha]=$SHA"
          echo "requested nix-config lock bump of '$INPUT' at $SHA"
