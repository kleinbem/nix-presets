name: Dispatch nix-config lock bump

# nix-config pins this repo in its flake.lock, and every host deploys from
# that lock (github:kleinbem/nix-config?ref=production). A merge here reaches
# no device until the lock moves, which the nightly Maintain Flake run does
# at 03:00 UTC together with nixpkgs and every other input. Ask for a bump
# of exactly this input as soon as main is green instead: nix-config opens
# (or extends) its lock PR, CI builds the device closures, auto-merge lands
# it, build-all promotes. The App token is scoped to nix-config and only
# needs the contents permission the App already has for its lock PRs.
on:
  workflow_run:
    workflows: ["Check Flake"]
    branches: [main]
    types: [completed]

permissions: {}

jobs:
  dispatch:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token for nix-config
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: nix-config

      - name: Ask Maintain Flake to bump this input
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          INPUT: ${{ github.event.repository.name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$OWNER/nix-config/dispatches" \
            -f event_type=lock-bump \
            -f "client_payload[inputs]=$INPUT" \
            -f "client_payload[sha]=$SHA"
          echo "requested nix-config lock bump of '$INPUT' at $SHA"
