name: "Update freecad-mcp"

# Bumps the pinned neka-nat/freecad-mcp source in pkgs/freecad-mcp.nix to the latest git
# tag and opens a PR. No upstream flake/PyPI package — vendored via
# fetchFromGitHub, so this discovers the tag, re-derives the source hash,
# and rebuilds the actual Python package standalone to verify.

on:
  schedule:
    # Tuesdays 05:00 UTC — same slot family as the other update-* workflows,
    # different day/repo.
    - cron: '0 5 * * 2'
  workflow_dispatch:

# Everything goes through the App token below.
permissions:
  contents: read

jobs:
  update:
    name: "Bump freecad-mcp & open PR"
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: kleinbem/actions/nix-setup@c5fb62f7a90fc2986a153121ee650962a825929a # v1.6.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          nix-path: nixpkgs=channel:nixos-unstable

      - name: Run updater
        id: update
        run: |
          chmod +x scripts/update-freecad-mcp.sh
          ./scripts/update-freecad-mcp.sh
          if git diff --quiet -- pkgs/freecad-mcp.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            VER=$(grep -oP 'version = "\K[^"]+' pkgs/freecad-mcp.nix | head -1)
            echo "version=$VER" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        id: cpr
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.update.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          BRANCH_NAME="auto-update/freecad-mcp"
          MAIN_SHA=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)

          if gh api "repos/$REPO/git/ref/heads/$BRANCH_NAME" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH_NAME" -f sha="$MAIN_SHA" -F force=true >/dev/null
          else
            gh api "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH_NAME" -f sha="$MAIN_SHA" >/dev/null
          fi

          jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH_NAME" \
            --arg sha "$MAIN_SHA" \
            --arg headline "chore: update freecad-mcp to ${VERSION}" \
            --arg content "$(base64 -w0 pkgs/freecad-mcp.nix)" \
            --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
            '{query: $query, variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: $headline},
                expectedHeadOid: $sha,
                fileChanges: {additions: [{path: "pkgs/freecad-mcp.nix", contents: $content}]}
            }}}' | gh api graphql --input -

          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<'EOF'
          ## freecad-mcp update

          Bumps the pinned `neka-nat/freecad-mcp` source in `pkgs/freecad-mcp.nix` to the
          latest git tag: **@VERSION@**. The
          source hash was re-derived from that tag's GitHub archive tarball.

          ✅ The actual `buildPythonPackage` output was rebuilt standalone
          (not just the source fetch) to catch real packaging breakage, not
          just a bad hash.

          ---
          🤖 Opened automatically by the update-freecad-mcp workflow.
          EOF
          sed -i "s|@VERSION@|${VERSION}|" "$BODY_FILE"

          gh pr create \
            --title "chore: update freecad-mcp to ${VERSION}" \
            --body-file "$BODY_FILE" \
            --head "$BRANCH_NAME" \
            --base main \
            --label dependencies || true

          echo "pull-request-number=$(gh pr view "$BRANCH_NAME" --json number --jq .number)" >> "$GITHUB_OUTPUT"

      # Fully hands-off: update-freecad-mcp.sh's own full-package rebuild is
      # the gate, so squash-merge immediately.
      - name: Auto-merge
        if: steps.update.outputs.changed == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR" --squash --delete-branch --auto \
            || gh pr merge "$PR" --squash --delete-branch
