name: Check Flake

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: cachix/install-nix-action@v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Debug backup-engine VM test (test branch only)
        timeout-minutes: 20
        run: |
          ls -l /dev/kvm || true
          ( while true; do echo "[mon] $(date +%T) mem: $(free -m | awk '/Mem:/{print $3"/"$2" MB used"}') disk: $(df -h / /tmp | awk 'NR>1{print $6" "$4" free"}' | tr '\n' ' ')"; sleep 10; done ) &
          nix build -L --no-link .#checks.x86_64-linux.backup-engine --override-input nix-devshells github:kleinbem/nix-devshells --override-input nix-packages github:kleinbem/nix-packages
      - run: nix flake check --override-input nix-devshells github:kleinbem/nix-devshells --override-input nix-packages github:kleinbem/nix-packages
      - run: nix fmt --override-input nix-devshells github:kleinbem/nix-devshells --override-input nix-packages github:kleinbem/nix-packages -- --fail-on-change
