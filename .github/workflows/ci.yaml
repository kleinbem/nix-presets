name: Check Flake

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: kleinbem/actions/nix-setup@d640cb482c1083235491da5ce469468a0019fc64 # v1.0.0
        with:
          nix-path: nixpkgs=channel:nixos-unstable
          # Read-only Attic over NetBird; skipped when the secrets are
          # absent (fork PRs, Dependabot).
          netbird-setup-key: ${{ secrets.NETBIRD_SETUP_KEY_EPHEMERAL }}
          attic-token: ${{ secrets.ATTIC_PULL_TOKEN }}
      # Build the NixOS VM test on its own first. Inside `nix flake check` it
      # runs next to the other builds and the guest dies on the runner (#108:
      # BrokenPipeError on the backdoor shell, or the job gets cancelled);
      # alone it passes in ~30 s, and -L shows the guest console if it breaks.
      - name: Build the backup-engine VM test
        run: nix build -L --no-link .#checks.x86_64-linux.backup-engine --override-input nix-devshells github:kleinbem/nix-devshells --override-input nix-packages github:kleinbem/nix-packages
      - run: nix flake check --override-input nix-devshells github:kleinbem/nix-devshells --override-input nix-packages github:kleinbem/nix-packages
      - run: nix fmt --override-input nix-devshells github:kleinbem/nix-devshells --override-input nix-packages github:kleinbem/nix-packages -- --fail-on-change
